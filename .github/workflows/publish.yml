name: Publish

# GATED — merging an ordinary PR NEVER publishes. Two independent guards must BOTH
# hold for the publish step to run:
#   1. Trigger: only a pushed release tag matching `keyshelf-v*` (e.g.
#      `keyshelf-v6.0.0`, the scheme release-please emits via
#      include-component-in-tag). A merge to `main`, or any pull_request, cannot
#      start this workflow at all.
#   2. Step guard: the publish step is skipped unless the ref is a `keyshelf-v*`
#      tag, so a `workflow_dispatch` run on a branch ref only builds + verifies.
# A reviewer can confirm by inspection that an ordinary PR publishes nothing:
# there is no `push: branches` / `pull_request` trigger, so this workflow cannot
# even start from a PR merge.
#
# AUTH: npm trusted publishing (OIDC) — there is NO long-lived npm token secret.
# Each of the six packages (keyshelf + @keyshelf/sops-*) has a GitHub Actions
# trusted publisher configured on npmjs.com (owner `pantoninho`, repo `keyshelf`,
# workflow `publish.yml`, no environment). `npm publish` exchanges this run's
# GitHub OIDC token (`id-token: write`) for a short-lived publish credential.
# Requires npm >= 11.5.1, installed explicitly below.
#
# NOTE: publishing is now AUTOMATIC on release. release-please creates the
# `keyshelf-v*` tag using the default `GITHUB_TOKEN`, and GitHub suppresses
# workflow-event cascades from that token — so the tag *push* does NOT auto-trigger
# this workflow. Instead, the `release-please` job in ci.yml dispatches this
# workflow (`gh workflow run publish.yml --ref <tag>`) when — and only when — a
# `keyshelf` release is created; `workflow_dispatch` is exempt from the
# GITHUB_TOKEN recursion guard, so that dispatch starts a real run. Dispatching on
# the tag ref keeps the publish step's `startsWith(github.ref, …)` guard true.
#
# Manual dispatch remains the fallback (e.g. to re-run a publish, or if the
# automatic dispatch ever fails):
#     gh workflow run publish.yml --ref keyshelf-v<x.y.z>

on:
  push:
    tags:
      - "keyshelf-v*"
  # Manual trigger. On a branch ref this is a dry-run (builds + verifies only —
  # the publish step's `startsWith(github.ref, 'refs/tags/keyshelf-v')` guard is
  # false). On a `keyshelf-v*` tag ref it publishes for real, which is how a
  # release is shipped after merge (see the NOTE above).
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance via OIDC.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 20 bundles npm 10. Install it
      # explicitly rather than depending on whatever npm a Node release ships.
      - name: Install npm >= 11.5.1 (trusted publishing)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      - run: npm run build -w keyshelf

      # Build all five platform packages from sops-version.json: download each
      # pinned binary, SHA256-verify it against the committed manifest, assemble
      # the package, and smoke-test `sops --version` on the host's binary. A
      # tampered/mismatched binary fails here, before anything is published.
      - name: Build + integrity-verify platform packages
        run: npm run platforms:build -w keyshelf

      # Re-run the integrity assertions (os/cpu match, MPL-2.0, checksum, tarball
      # contents) as an explicit gate independent of the build script.
      - name: Verify platform packages (checksums, os/cpu, tarball contents)
        run: npm run platforms:verify -w keyshelf

      - name: Verify the integrity of provenance attestations and registry signatures
        run: npm audit signatures
        working-directory: packages/cli

      # Publish the five platform packages, then keyshelf. `--provenance` attaches
      # a signed provenance statement; auth is the OIDC trusted publisher (no token).
      # GUARDED: only runs on a `keyshelf-v*` tag ref. An ordinary PR can't even
      # start this workflow, so nothing is published on merge; a tag run publishes
      # for real.
      - name: Publish platform packages + keyshelf (provenance, OIDC)
        if: startsWith(github.ref, 'refs/tags/keyshelf-v')
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          # Paths are prefixed with `./` deliberately: npm parses a bare
          # `owner/repo`-shaped arg (e.g. `packages/cli`) as a GitHub shorthand
          # and tries to git-fetch it. `./` forces local-folder resolution.
          # Each publish is idempotent (skip if the version is already on npm) so
          # a partial publish can be safely re-run without 403s.
          SOPS_VERSION="$(node -p "require('./packages/cli/sops-version.json').sopsVersion")"
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            pkg="@keyshelf/sops-${key}"
            if npm view "${pkg}@${SOPS_VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${SOPS_VERSION} already published — skipping"
            else
              echo "Publishing ${pkg} …"
              npm publish "./packages/cli/platforms/sops-${key}" --provenance --access public
            fi
          done
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "keyshelf@${CLI_VERSION}" version >/dev/null 2>&1; then
            echo "keyshelf@${CLI_VERSION} already published — skipping"
          else
            # v6 ships under the `next` dist-tag — `latest` stays on 5.x until a
            # deliberate promotion (`npm dist-tag add keyshelf@<ver> latest`).
            # npm publish defaults to `latest` regardless of version, so `--tag
            # next` is explicit. Flip it when promoting v6 to `latest`.
            echo "Publishing keyshelf@${CLI_VERSION} (dist-tag: next) …"
            npm publish "./packages/cli" --provenance --access public --tag next
          fi
